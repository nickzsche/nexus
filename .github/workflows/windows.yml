name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller
      - name: Testler (Playwright hariç)
        env:
          NEXUS_DATA: ${{ runner.temp }}\nexus-test
        run: python -m pytest -q --ignore=tests/test_hud.py
      - name: Derle
        run: |
          python build/make_icon.py
          pyinstaller --noconfirm --distpath dist --workpath build/work build/nexus.spec
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NEXUS -DestinationPath dist/NEXUS-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-windows
          path: dist/NEXUS-windows.zip
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NEXUS-windows.zip
